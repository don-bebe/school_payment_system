
name: Build School Fees Windows App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-client:
    name: Extract CLIENT folder
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package CLIENT only
        run: tar -czf client-source.tar.gz CLIENT

      - name: Upload CLIENT source
        uses: actions/upload-artifact@v4
        with:
          name: client-source
          path: client-source.tar.gz
          retention-days: 1

  build-windows:
    name: Build Windows Installer
    needs: prepare-client
    runs-on: windows-latest

    steps:
      - name: Download CLIENT source
        uses: actions/download-artifact@v4
        with:
          name: client-source
          path: .

      - name: Extract CLIENT
        run: tar -xzf client-source.tar.gz

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CLIENT/package-lock.json

      - name: Install dependencies
        working-directory: CLIENT
        run: npm ci

      - name: Build Windows application
        working-directory: CLIENT
        run: npm run electron:build -- --win --x64

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: School-Fees-Windows-Installer
          path: CLIENT/release/*.exe
          if-no-files-found: error
          retention-days: 14
